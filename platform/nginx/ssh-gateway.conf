pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 128; }
stream {
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 2225;
        set $ssh_target nhx05:22;
        proxy_pass $ssh_target;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
    }
}
