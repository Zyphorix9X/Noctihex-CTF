server {
    listen 80;
    server_name noctihex.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name noctihex.local;

    ssl_certificate     /etc/nginx/tls/noctihex.crt;
    ssl_certificate_key /etc/nginx/tls/noctihex.key;

    location / {
        proxy_pass http://ctfd:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /labs/nhx03/ {
        proxy_pass http://nhx03:5000/;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}